server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Para cualquier ruta que no corresponda a un fichero o directorio
    # estático existente, nginx sirve index.html y deja que React Router
    # gestione la navegación en el cliente (SPA routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
